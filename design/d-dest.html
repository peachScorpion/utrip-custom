<!DOCTYPE html><html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>优定制 · 目的地页三种版面</title>
<link href="https://fonts.googleapis.cn/css2?family=Cormorant+Garamond:wght@300;400&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#eeefec; --paper2:#e6e8e4; --ink:#16201c; --ink2:#5c6862; --ink3:#8b938f;
  --forest:#2d4a3a; --hair:rgba(22,32,28,.13); --tab-h:58px;
  --serif:"Songti SC","Noto Serif SC","Source Han Serif SC","STSong",serif;
  --en:"Cormorant Garamond","Palatino Linotype",Palatino,Georgia,serif;
  --sans:-apple-system,"PingFang SC","Helvetica Neue",Arial,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
img{display:block;width:100%;height:100%;object-fit:cover}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
body{background:#0d100f;font-family:var(--sans);font-size:15px;line-height:1.8;color:var(--ink)}
.stage{min-height:100dvh;display:flex;justify-content:center;align-items:flex-start}
.phone{width:100%;max-width:430px;min-height:100dvh;position:relative;overflow:hidden;background:var(--paper)}
@media(min-width:900px){.stage{padding:26px 0 46px}.phone{box-shadow:0 40px 120px rgba(0,0,0,.4)}}

/* 方案切换条：只存在于这份设计稿，上线不要 */
.pick{position:sticky;top:0;z-index:50;display:flex;background:var(--ink);color:#e7ece9}
.pick button{flex:1;padding:11px 4px;font-size:12px;letter-spacing:.06em;opacity:.5;
  border-bottom:2px solid transparent;transition:.25s}
.pick button.on{opacity:1;border-bottom-color:#a8c4b2}
.pick button i{font-style:normal;display:block;font-family:var(--en);font-size:10px;letter-spacing:.2em;opacity:.7}

.scroll{height:calc(100dvh - 42px);overflow-y:auto;overflow-x:hidden;
  padding-bottom:calc(var(--tab-h) + 20px);-webkit-overflow-scrolling:touch}
.view{display:none}.view.on{display:block}

/* 顶栏（三个版面共用） */
.top{background:var(--paper);border-bottom:1px solid var(--hair);padding:14px 20px 12px}
.top h1{font-family:var(--serif);font-weight:400;font-size:23px;margin-bottom:11px}
.top .sb{display:flex;align-items:center;gap:9px;height:36px;border:1px solid var(--hair);
  background:#fff;padding:0 13px;color:var(--ink3);font-size:13px}
.top .sb svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.6}

/* 大洲筛选（横向，取代原来左侧竖栏） */
.regs{display:flex;gap:18px;overflow-x:auto;padding:12px 20px 11px;background:var(--paper);
  border-bottom:1px solid var(--hair);scrollbar-width:none;position:sticky;top:0;z-index:20}
.regs::-webkit-scrollbar{display:none}
.regs span{flex:0 0 auto;font-size:13.5px;color:var(--ink3);padding-bottom:3px;border-bottom:1px solid transparent}
.regs span.on{color:var(--ink);font-family:var(--serif);border-bottom-color:var(--forest)}

/* ============ A · 索引 ============ */
.ix-ch{display:flex;align-items:baseline;gap:11px;padding:26px 20px 12px}
.ix-ch b{font-family:var(--serif);font-weight:400;font-size:19px}
.ix-ch i{font-style:normal;font-family:var(--en);font-size:11px;letter-spacing:.24em;
  text-transform:uppercase;color:var(--ink3)}
.ix-ch u{flex:1;height:1px;background:var(--hair);text-decoration:none}
.ix-row{display:flex;gap:14px;align-items:center;padding:14px 20px;border-bottom:1px solid var(--hair);background:#fff}
.ix-row .ph{flex:0 0 76px;height:76px;overflow:hidden}
.ix-row .t{flex:1;min-width:0}
.ix-row .t .n{display:flex;align-items:baseline;gap:8px}
.ix-row .t .n b{font-family:var(--serif);font-size:18px;font-weight:400}
.ix-row .t .n i{font-style:normal;font-family:var(--en);font-size:11px;letter-spacing:.18em;
  text-transform:uppercase;color:var(--ink3)}
.ix-row .t p{font-size:12.5px;color:var(--ink2);margin-top:4px;line-height:1.66;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ix-row .t .c{font-size:10.5px;color:var(--ink3);margin-top:5px;letter-spacing:.04em}
.ix-row .p{flex:0 0 auto;text-align:right}
.ix-row .p b{font-family:var(--en);font-size:17px;font-weight:400;display:block}
.ix-row .p i{font-style:normal;font-size:9.5px;color:var(--ink3)}

/* ============ B · 一屏一国 ============ */
.fu{position:relative;height:74vh;min-height:430px;overflow:hidden;border-bottom:1px solid rgba(255,255,255,.1)}
.fu .g{position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(10,15,12,.3) 0%,rgba(10,15,12,.04) 34%,rgba(10,15,12,.86) 100%)}
.fu .c{position:absolute;left:22px;right:22px;bottom:26px;color:#ece9e1;z-index:2}
.fu .c .en{font-family:var(--en);font-size:11.5px;letter-spacing:.32em;text-transform:uppercase;
  color:#c2d4c7;margin-bottom:10px}
.fu .c h2{font-family:var(--serif);font-weight:400;font-size:32px;line-height:1.25}
.fu .c p{font-size:14px;line-height:1.9;margin-top:11px;color:rgba(236,233,225,.9);max-width:17em}
.fu .c .ft{display:flex;align-items:flex-end;gap:12px;margin-top:17px;
  padding-top:14px;border-top:1px solid rgba(236,233,225,.24)}
.fu .c .ft .ci{flex:1;font-size:11.5px;color:rgba(236,233,225,.76);letter-spacing:.04em;line-height:1.7}
.fu .c .ft .pr{text-align:right}
.fu .c .ft .pr i{font-style:normal;display:block;font-size:10px;color:rgba(236,233,225,.66);margin-bottom:2px}
.fu .c .ft .pr b{font-family:var(--en);font-size:21px;font-weight:400}

/* ============ C · 错落网格 ============ */
.mg{padding:0 14px}
.mg .ch{display:flex;align-items:baseline;gap:11px;padding:24px 6px 13px}
.mg .ch b{font-family:var(--serif);font-weight:400;font-size:19px}
.mg .ch i{font-style:normal;font-family:var(--en);font-size:11px;letter-spacing:.24em;
  text-transform:uppercase;color:var(--ink3)}
.mg .ch u{flex:1;height:1px;background:var(--hair);text-decoration:none}
.mg .g{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mg .card{position:relative;overflow:hidden;height:196px}
.mg .card.tall{height:248px}
.mg .card.wide{grid-column:1/-1;height:200px}
.mg .card .gr{position:absolute;inset:0;background:linear-gradient(180deg,transparent 34%,rgba(10,15,12,.84) 100%)}
.mg .card .c{position:absolute;left:0;right:0;bottom:0;padding:14px 14px 13px;color:#ece9e1;z-index:2}
.mg .card .c .en{font-family:var(--en);font-size:9.5px;letter-spacing:.24em;text-transform:uppercase;
  color:#b9cfc0;margin-bottom:4px}
.mg .card .c b{font-family:var(--serif);font-weight:400;font-size:19px;display:block}
.mg .card.wide .c b{font-size:22px}
.mg .card .c p{font-size:11.5px;color:rgba(236,233,225,.84);margin-top:4px;line-height:1.65;
  display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.mg .card.wide .c p{-webkit-line-clamp:2}
.mg .card .c .pr{font-family:var(--en);font-size:14px;margin-top:7px;color:#e5eae7}

.foot{margin-top:34px;padding:24px 20px 30px;border-top:1px solid var(--hair);
  text-align:center;background:var(--paper2)}
.foot .mk{font-family:var(--en);font-size:15px;letter-spacing:.2em;color:var(--ink2)}
.foot .co{margin-top:8px;font-size:10px;color:var(--ink3)}

/* 底部 tab */
.tabs{position:absolute;left:0;right:0;bottom:0;z-index:40;height:var(--tab-h);
  background:rgba(238,239,236,.95);backdrop-filter:saturate(180%) blur(16px);
  border-top:1px solid var(--hair);display:flex}
.tabs .tb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  font-size:10px;color:var(--ink3);position:relative}
.tabs .tb svg{width:19px;height:19px;stroke:var(--ink3);fill:none;stroke-width:1.5;
  stroke-linecap:round;stroke-linejoin:round}
.tabs .tb.on{color:var(--forest)}
.tabs .tb.on svg{stroke:var(--forest);stroke-width:1.8}
.tabs .tb.mid{flex:0 0 74px}
.tabs .tb.mid .bump{position:absolute;top:-19px;width:50px;height:50px;background:var(--forest);
  display:grid;place-items:center;box-shadow:0 7px 20px rgba(45,74,58,.34)}
.tabs .tb.mid .bump svg{width:22px;height:22px;stroke:#eef0ed}
.tabs .tb.mid span{margin-top:34px;color:var(--forest)}

  <div class="tb"><svg viewBox="0 0 24 24"><circle cx="12" cy="8.5" r="3.6"/><path d="M4.8 20c.9-3.6 3.8-5.6 7.2-5.6s6.3 2 7.2 5.6"/></svg>我的</div>

</div></div>
<script>
const P='https://uux-public.oss-cn-beijing.aliyuncs.com/travel/guide/pexels_image/pexels_image_';
const im=(id,w,ext)=>P+id+'.'+(ext||'jpeg')+'?x-oss-process=image/resize,w_'+w+'/quality,q_80/format,jpg';
/* 八条真实数据，文案与起价都取自系统里现有的目的地配置 */
const D=[
 {n:'冰岛',en:'Iceland',r:'欧洲',t:'在世界的尽头，等一场绿色的风',c:['雷克雅未克','维克','阿克雷里'],b:2600,id:30489053},
 {n:'瑞士',en:'Switzerland',r:'欧洲',t:'把阿尔卑斯的清晨，装进你的窗',c:['苏黎世','因特拉肯','采尔马特'],b:2800,id:871053},
 {n:'意大利',en:'Italy',r:'欧洲',t:'一半是艺术，一半是餐桌',c:['罗马','佛罗伦萨','威尼斯'],b:2300,id:12489137},
 {n:'法国',en:'France',r:'欧洲',t:'优雅这件事，法国人从不着急',c:['巴黎','尼斯','普罗旺斯'],b:2500,id:760980},
 {n:'西班牙',en:'Spain',r:'欧洲',t:'白天是阳光，夜里是弗拉门戈',c:['马德里','巴塞罗那','塞维利亚'],b:2100,id:35672429},
 {n:'英国',en:'United Kingdom',r:'欧洲',t:'从西敏的钟声，走到皇家一英里',c:['伦敦','爱丁堡','湖区'],b:2400,id:32883196},
 {n:'希腊',en:'Greece',r:'欧洲',t:'蓝白之间，只剩海风',c:['雅典','圣托里尼'],b:2200,id:221532},
 {n:'日本',en:'Japan',r:'亚洲',t:'把四季，过成一场仪式',c:['东京','京都','箱根'],b:2000,id:31046945},
];
const eu=D.filter(d=>d.r==='欧洲'), as=D.filter(d=>d.r==='亚洲');

// A 索引
const ixRow=d=>`<div class="ix-row">
  <div class="ph"><img src="${im(d.id,240)}" alt=""></div>
  <div class="t"><div class="n"><b>${d.n}</b><i>${d.en}</i></div>
    <p>${d.t}</p><div class="c">${d.c.join(' · ')}</div></div>
  <div class="p"><b>&yen;${d.b.toLocaleString()}</b><i>日均起</i></div></div>`;
document.getElementById('ix-eu').innerHTML=eu.map(ixRow).join('');
document.getElementById('ix-as').innerHTML=as.map(ixRow).join('');

// B 一屏一国
document.getElementById('fu-list').innerHTML=D.map(d=>`<div class="fu">
  <img src="${im(d.id,900)}" alt=""><div class="g"></div>
  <div class="c"><div class="en">${d.en}</div><h2>${d.n}</h2><p>${d.t}</p>
    <div class="ft"><div class="ci">${d.c.join('　')}</div>
      <div class="pr"><i>日均起</i><b>&yen;${d.b.toLocaleString()}</b></div></div></div></div>`).join('');

// C 错落：第一个大通栏，其余两列，每第三个拉高，节奏不重复
const mgCard=(d,i)=>{
  const cls=i===0?'card wide':(i%3===1?'card tall':'card');
  return `<div class="${cls}"><img src="${im(d.id,i===0?900:520)}" alt=""><div class="gr"></div>
    <div class="c"><div class="en">${d.en}</div><b>${d.n}</b><p>${d.t}</p>
      <div class="pr">&yen;${d.b.toLocaleString()} 日均起</div></div></div>`;
};
document.getElementById('mg-eu').innerHTML=eu.map(mgCard).join('');
document.getElementById('mg-as').innerHTML=as.map((d,i)=>mgCard(d,i+1)).join('');

// 方案切换
const sc=document.getElementById('sc');
document.querySelectorAll('.pick button').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('.pick button').forEach(x=>x.classList.toggle('on',x===b));
  document.querySelectorAll('.view').forEach(v=>v.classList.toggle('on', v.id==='v-'+b.dataset.v));
  sc.scrollTop=0;
}));
</script>
