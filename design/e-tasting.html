<!DOCTYPE html><html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>优定制 · 首页方案 D · 风味</title>
<link href="https://fonts.googleapis.cn/css2?family=Cormorant+Garamond:wght@300;400&family=IBM+Plex+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f0f0ec; --paper2:#e7e8e3; --card:#fbfbf9;
  --ink:#16201c; --ink2:#5c6862; --ink3:#949b96;
  --forest:#2d4a3a; --clay:#8c5a3c;            /* 刻度用的第二色，像烘焙度标 */
  --hair:rgba(22,32,28,.13); --hair2:rgba(22,32,28,.07);
  --tab-h:58px;
  --serif:"Songti SC","Noto Serif SC","Source Han Serif SC","STSong",serif;
  --en:"Cormorant Garamond","Palatino Linotype",Palatino,Georgia,serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:-apple-system,"PingFang SC","Helvetica Neue",Arial,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
img{display:block;width:100%;height:100%;object-fit:cover}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
body{background:#0d100f;font-family:var(--sans);font-size:15px;line-height:1.8;color:var(--ink)}
.stage{min-height:100dvh;display:flex;justify-content:center;align-items:flex-start}
.phone{width:100%;max-width:430px;min-height:100dvh;position:relative;overflow:hidden;background:var(--paper)}
@media(min-width:900px){.stage{padding:26px 0 46px}.phone{box-shadow:0 40px 120px rgba(0,0,0,.4)}}
.scroll{height:100dvh;overflow-y:auto;overflow-x:hidden;
  padding-bottom:calc(var(--tab-h) + 20px);-webkit-overflow-scrolling:touch}

/* ---------- 顶栏 ---------- */
.top{position:sticky;top:0;z-index:30;background:rgba(240,240,236,.94);
  backdrop-filter:saturate(180%) blur(14px);border-bottom:1px solid var(--hair);
  display:flex;align-items:center;justify-content:space-between;padding:13px 20px}
.top .mk{font-family:var(--en);font-size:18px;letter-spacing:.16em}
.top .mk i{font-style:normal;font-family:var(--serif);font-size:11.5px;letter-spacing:.28em;
  color:var(--ink2);margin-left:8px}
.top .sr{width:17px;height:17px;stroke:var(--ink2);fill:none;stroke-width:1.6}

/* ---------- 开场：问一句话，给三组对立 ---------- */
.ask{padding:30px 24px 22px}
.ask .k{font-family:var(--en);font-size:11px;letter-spacing:.3em;text-transform:uppercase;
  color:var(--forest);margin-bottom:14px}
.ask h1{font-family:var(--serif);font-weight:400;font-size:25px;line-height:1.5;letter-spacing:.01em}
.ask p{font-size:12.5px;color:var(--ink2);margin-top:13px;line-height:1.95;max-width:20em}

.dials{padding:0 24px}
.dial{padding:13px 0;border-top:1px solid var(--hair)}
.dial:last-of-type{border-bottom:1px solid var(--hair)}
.dial .lb{font-size:11px;letter-spacing:.14em;color:var(--ink3);margin-bottom:8px}
.dial .opts{display:flex;gap:9px}
.dial .opts button{flex:1;padding:9px 6px;border:1px solid var(--hair);background:var(--card);
  font-family:var(--serif);font-size:14.5px;color:var(--ink2);transition:.28s cubic-bezier(.16,1,.3,1)}
.dial .opts button .en{display:block;font-family:var(--en);font-size:9.5px;letter-spacing:.2em;
  text-transform:uppercase;margin-top:3px;opacity:.55}
.dial .opts button.on{background:var(--forest);border-color:var(--forest);color:#eef0ed}
.dial .opts button.on .en{opacity:.75}

/* ---------- 匹配结果条 ---------- */
.res{margin:20px 24px 0;padding:12px 0;border-top:1px solid var(--ink);
  display:flex;align-items:baseline;justify-content:space-between}
.res b{font-family:var(--serif);font-weight:400;font-size:15px}
.res b em{font-style:normal;font-family:var(--mono);font-size:17px;color:var(--forest);margin:0 3px}
.res span{font-size:11px;color:var(--ink3);letter-spacing:.06em}

/* ---------- 风味卡：一个目的地一张，像豆袋标签 ---------- */
.cards{padding:14px 16px 0}
.card{background:var(--card);border:1px solid var(--hair);margin-bottom:14px;overflow:hidden;
  transition:opacity .45s ease}
.card.dim{opacity:.45}
.card .ph{height:172px;position:relative}
.card .ph .no{position:absolute;left:0;top:0;background:var(--paper);color:var(--ink);
  font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;padding:5px 10px}
.card .ph .mt{position:absolute;right:0;bottom:0;background:rgba(240,240,236,.93);
  font-family:var(--mono);font-size:10px;letter-spacing:.06em;padding:5px 10px;color:var(--ink2)}
.card .bd{padding:16px 17px 17px}
.card .hd{display:flex;align-items:baseline;gap:9px}
.card .hd h3{font-family:var(--serif);font-weight:400;font-size:22px}
.card .hd i{font-style:normal;font-family:var(--en);font-size:11px;letter-spacing:.2em;
  text-transform:uppercase;color:var(--ink3)}
.card .say{font-size:13px;color:var(--ink2);margin-top:7px;line-height:1.8}

/* 风味词：像豆袋上的 tasting notes */
.notes{display:flex;flex-wrap:wrap;gap:6px;margin-top:13px}
.notes span{font-size:11px;color:var(--forest);border:1px solid rgba(45,74,58,.28);
  padding:3px 8px;letter-spacing:.04em}

/* 杯测刻度：五个维度，方块刻度 */
.cup{margin-top:15px;padding-top:14px;border-top:1px solid var(--hair2)}
.cup .row{display:flex;align-items:center;gap:11px;padding:3.5px 0}
.cup .row .n{font-family:var(--serif);font-size:12.5px;color:var(--ink2);flex:0 0 16px}
.cup .row .sc{display:flex;gap:4px;flex:1}
.cup .row .sc i{height:6px;flex:1;background:var(--hair2);display:block}
.cup .row .sc i.f{background:var(--forest)}
.cup .row .v{font-family:var(--mono);font-size:10px;color:var(--ink3);flex:0 0 22px;text-align:right}

/* 参数表：像产区信息 */
.spec{display:grid;grid-template-columns:1fr 1fr;gap:1px;margin-top:15px;
  background:var(--hair2);border:1px solid var(--hair2)}
.spec div{background:var(--card);padding:9px 11px}
.spec div i{font-style:normal;display:block;font-size:9.5px;letter-spacing:.12em;color:var(--ink3);margin-bottom:2px}
.spec div b{font-family:var(--mono);font-size:13px;font-weight:400}
.card .go{display:flex;align-items:center;justify-content:center;gap:10px;height:44px;margin-top:15px;
  border:1px solid var(--forest);color:var(--forest);font-size:13px;letter-spacing:.16em}
.card .go u{text-decoration:none;font-family:var(--en);font-size:15px;line-height:1}

/* ---------- 本月新到 ---------- */
.new{margin-top:30px;padding:26px 20px 0;border-top:1px solid var(--hair)}
.new .hd{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:15px}
.new .hd h3{font-family:var(--serif);font-weight:400;font-size:20px}
.new .hd span{font-size:11px;color:var(--ink3);letter-spacing:.08em}
.new .rail{display:flex;gap:11px;overflow-x:auto;margin:0 -20px;padding:0 20px 4px;
  scroll-snap-type:x mandatory;scrollbar-width:none}
.new .rail::-webkit-scrollbar{display:none}
.new .it{flex:0 0 61%;scroll-snap-align:start}
.new .it .ph{height:152px;overflow:hidden;margin-bottom:10px}
.new .it b{display:block;font-family:var(--serif);font-size:15px;font-weight:400;line-height:1.55}
.new .it .m{margin-top:5px;font-family:var(--mono);font-size:10.5px;color:var(--ink3);letter-spacing:.04em}

/* ---------- 定制师 ---------- */
.taster{margin:32px 20px 0;border:1px solid var(--hair);background:var(--card);padding:20px 19px}
.taster .k{font-family:var(--en);font-size:10px;letter-spacing:.26em;text-transform:uppercase;
  color:var(--forest);margin-bottom:11px}
.taster q{quotes:none;display:block;font-family:var(--serif);font-size:16px;line-height:1.95}
.taster .who{display:flex;align-items:center;gap:11px;margin-top:16px;padding-top:14px;border-top:1px solid var(--hair2)}
.taster .who .av{flex:0 0 40px;height:40px;overflow:hidden;background:var(--paper2)}
.taster .who .t{flex:1}
.taster .who .t b{display:block;font-family:var(--serif);font-size:14px;font-weight:400}
.taster .who .t i{font-style:normal;font-size:10.5px;color:var(--ink3);letter-spacing:.04em}
.taster .who .go{border:1px solid var(--forest);color:var(--forest);padding:8px 13px;font-size:11.5px;letter-spacing:.1em}

.foot{margin-top:34px;padding:24px 20px 30px;border-top:1px solid var(--hair);
  text-align:center;background:var(--paper2)}
.foot .mk{font-family:var(--en);font-size:15px;letter-spacing:.2em;color:var(--ink2)}
.foot .co{margin-top:8px;font-size:10px;color:var(--ink3);line-height:1.9}

/* ---------- 底部 tab ---------- */
.tabs{position:absolute;left:0;right:0;bottom:0;z-index:40;height:var(--tab-h);
  background:rgba(240,240,236,.95);backdrop-filter:saturate(180%) blur(16px);
  border-top:1px solid var(--hair);display:flex}
.tabs .tb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  font-size:10px;color:var(--ink3);position:relative}
.tabs .tb svg{width:19px;height:19px;stroke:var(--ink3);fill:none;stroke-width:1.5;
  stroke-linecap:round;stroke-linejoin:round}
.tabs .tb.on{color:var(--forest)}
.tabs .tb.on svg{stroke:var(--forest);stroke-width:1.8}
.tabs .tb.mid{flex:0 0 74px}
.tabs .tb.mid .bump{position:absolute;top:-19px;width:50px;height:50px;background:var(--forest);
  display:grid;place-items:center;box-shadow:0 7px 20px rgba(45,74,58,.34)}
.tabs .tb.mid .bump svg{width:22px;height:22px;stroke:#eef0ed}
.tabs .tb.mid span{margin-top:34px;color:var(--forest)}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

<script>
const P='https://uux-public.oss-cn-beijing.aliyuncs.com/travel/guide/pexels_image/pexels_image_';
const im=(id,w,ext)=>P+id+'.'+(ext||'jpeg')+'?x-oss-process=image/resize,w_'+w+'/quality,q_80/format,jpg';

/* 五个维度，取名一个字，像杯测表上的项目。
   野=自然荒野的浓度　人=人文与市井的密度　味=食物在旅程里的分量
   缓=节奏留白还是排满　奢=住宿与服务的舒适度 */
const DIM=[['野','Wild'],['人','Culture'],['味','Table'],['缓','Pace'],['奢','Comfort']];

/* 八个目的地。文案、城市、日均价取自系统现有配置；
   风味词由景点类型与产品标签聚合而来；五维评分是建议值，后台可调。 */
const D=[
 {n:'冰岛',en:'Iceland',t:'在世界的尽头，等一场绿色的风',
  notes:['极光','荒野','温泉','冰川'],s:[5,1,2,4,3],day:'9-11 天',best:'10-3 月',base:2600,fly:'13h',id:30489053},
 {n:'日本',en:'Japan',t:'把四季，过成一场仪式',
  notes:['四季','禅意','温泉','细节'],s:[2,5,5,4,5],day:'6-8 天',best:'3-5 · 10-12 月',base:2000,fly:'3h',id:31046945},
 {n:'瑞士',en:'Switzerland',t:'把阿尔卑斯的清晨，装进你的窗',
  notes:['雪山','山间火车','湖','干净'],s:[4,2,3,4,5],day:'8-10 天',best:'全年',base:2800,fly:'12h',id:871053},
 {n:'意大利',en:'Italy',t:'一半是艺术，一半是餐桌',
  notes:['古城','餐桌','艺术','市井'],s:[1,5,5,3,4],day:'10-12 天',best:'4-6 · 9-10 月',base:2300,fly:'12h',id:12489137},
 {n:'希腊',en:'Greece',t:'蓝白之间，只剩海风',
  notes:['蓝白','海风','落日','放空'],s:[2,3,4,5,4],day:'8-10 天',best:'5-10 月',base:2200,fly:'11h',id:221532},
 {n:'法国',en:'France',t:'优雅这件事，法国人从不着急',
  notes:['酒庄','美术馆','花园','慢'],s:[2,5,5,3,5],day:'10-12 天',best:'4-10 月',base:2500,fly:'11h',id:760980},
 {n:'西班牙',en:'Spain',t:'白天是阳光，夜里是弗拉门戈',
  notes:['阳光','弗拉门戈','市集','深夜'],s:[2,4,5,2,3],day:'10-12 天',best:'3-6 · 9-11 月',base:2100,fly:'13h',id:35672429},
 {n:'英国',en:'United Kingdom',t:'从西敏的钟声，走到皇家一英里',
  notes:['石屋','草地','下午茶','雨'],s:[3,4,3,3,4],day:'9-11 天',best:'5-9 月',base:2400,fly:'11h',id:32883196},
];

/* 三组对立选择。每一组对应五维里的一个方向，选了就给相关维度加权。 */
const DIALS=[
 {lb:'我想要的几天是', a:{t:'安静',en:'Quiet',w:{野:1.4,人:-0.9}}, b:{t:'热闹',en:'Lively',w:{人:1.4,味:0.7}}},
 {lb:'更想看的是',     a:{t:'荒野',en:'Wilderness',w:{野:1.6}},      b:{t:'人文',en:'Culture',w:{人:1.5,味:0.6}}},
 {lb:'节奏上',         a:{t:'留白',en:'Slow',w:{缓:1.5,奢:0.5}},      b:{t:'走满',en:'Full',w:{缓:-1.1,人:0.6}}},
];
const pickState=[null,null,null];

const dialsEl=document.getElementById('dials');
dialsEl.innerHTML=DIALS.map((d,i)=>`<div class="dial"><div class="lb">${d.lb}</div>
  <div class="opts">
    <button data-i="${i}" data-s="a">${d.a.t}<span class="en">${d.a.en}</span></button>
    <button data-i="${i}" data-s="b">${d.b.t}<span class="en">${d.b.en}</span></button>
  </div></div>`).join('');

const scoreOf=d=>{
  let sc=0, any=false;
  pickState.forEach((s,i)=>{
    if(!s) return; any=true;
    const w=DIALS[i][s].w;
    Object.entries(w).forEach(([k,v])=>{ const idx=DIM.findIndex(x=>x[0]===k); sc+=d.s[idx]*v; });
  });
  return any?sc:null;
};

const cardHtml=(d,i)=>`<div class="card" data-n="${d.n}">
  <div class="ph"><img src="${im(d.id,760)}" alt="">
    <div class="no">NO.${String(i+1).padStart(2,'0')}</div>
    <div class="mt">最佳 ${d.best}</div></div>
  <div class="bd">
    <div class="hd"><h3>${d.n}</h3><i>${d.en}</i></div>
    <div class="say">${d.t}</div>
    <div class="notes">${d.notes.map(x=>`<span>${x}</span>`).join('')}</div>
    <div class="cup">${DIM.map(([k],j)=>`<div class="row"><span class="n">${k}</span>
      <span class="sc">${[1,2,3,4,5].map(v=>`<i class="${v<=d.s[j]?'f':''}"></i>`).join('')}</span>
      <span class="v">${d.s[j]}.0</span></div>`).join('')}</div>
    <div class="spec">
      <div><i>建议天数</i><b>${d.day}</b></div>
      <div><i>日均起</i><b>&yen;${d.base.toLocaleString()}</b></div>
      <div><i>直飞时长</i><b>${d.fly}</b></div>
      <div><i>适合</i><b>${d.notes[0]}</b></div>
    </div>
    <div class="go">看这一支的行程 <u>&#8594;</u></div>
  </div></div>`;

function render(){
  const withScore=D.map(d=>({d,sc:scoreOf(d)}));
  const any=withScore.some(x=>x.sc!==null);
  const list=any?[...withScore].sort((a,b)=>b.sc-a.sc):withScore;
  document.getElementById('cards').innerHTML=list.map((x,i)=>cardHtml(x.d,i)).join('');
  document.getElementById('cnt').textContent=D.length;
  document.getElementById('sortby').textContent=any?'按你的口味排列':'按契合度排列';
  if(any){
    /* 只压掉明显不对口的，别把大半列表都调暗——那样像是在惩罚客人的选择。
       取前四名保持正常，其余按与首位的差距判断 */
    const cards=[...document.querySelectorAll('.card')];
    const max=list[0].sc;
    cards.forEach((c,i)=>{ if(i>=4 && list[i].sc < max-3.4) c.classList.add('dim'); });
  }
}
document.addEventListener('click',e=>{
  const b=e.target.closest('.dial .opts button'); if(!b) return;
  const i=+b.dataset.i, s=b.dataset.s;
  pickState[i]=pickState[i]===s?null:s;            // 再点一次取消
  document.querySelectorAll(`.dial .opts button[data-i="${i}"]`).forEach(x=>
    x.classList.toggle('on', x.dataset.s===pickState[i]));
  render();
});

document.getElementById('rail').innerHTML=[
 {t:'落基山脉，自驾的十天',m:'加拿大 · 6-9 月 · ¥34,500 起',id:871053},
 {t:'马赛马拉，迁徙季八天',m:'肯尼亚 · 7-10 月 · ¥33,800 起',id:29529439},
 {t:'南法与酒庄，十二天',m:'法国 · 4-10 月 · ¥25,800 起',id:760980},
].map(x=>`<div class="it"><div class="ph"><img src="${im(x.id,540)}" alt=""></div>
  <b>${x.t}</b><div class="m">${x.m}</div></div>`).join('');

render();
</script>
